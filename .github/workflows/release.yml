name: Release

# Push a tag such as v0.1.0 to attach the built admin app (for the gateway to serve) to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:embedded
      - run: tar -czf sethucms-admin-${{ github.ref_name }}.tgz -C dist .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Unpack and set `SETHUCMS_ADMIN_DIR` to the folder so the gateway serves it at `/`.
          files: sethucms-admin-${{ github.ref_name }}.tgz
